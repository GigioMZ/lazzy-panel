{% extends "base.html" %}{% block title %}Ingresar{% endblock %}{% block main %}
<div class="card" style="max-width:340px;margin:12vh auto"><h1>Lazzy · Panel</h1>
{% if error %}<p class="msg bad">{{error}}</p>{% endif %}
<form method="post" style="display:grid;gap:10px"><input name="usuario" placeholder="Usuario" autocomplete="username" required>
<input name="clave" type="password" placeholder="Clave" autocomplete="current-password" required><button>Ingresar</button></form></div>{% endblock %}
